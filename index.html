<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>DeskPet-Doom controller</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #101418; color: #e8eef2;
    font-family: system-ui, sans-serif; touch-action: none; overscroll-behavior: none;
    overflow: hidden; }
  body { display: flex; flex-direction: column; }

  /* --- top bar --- */
  header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
  h1 { font-size: 15px; letter-spacing: 1px; margin: 0; white-space: nowrap; }
  #status { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #232a31;
    white-space: nowrap; margin-left: auto; }
  #status.ok { background: #14532d; }
  #status.bad { background: #7f1d1d; }
  #connect { padding: 8px 16px; border-radius: 9px; font-size: 13px; border: none;
    background: #2563eb; color: #fff; white-space: nowrap; }
  #connect:disabled { background: #334155; }
  button { font: inherit; color: inherit; background: #232a31; border: 1px solid #3b4450; }

  /* --- NES controller shell --- */
  .gamepad { flex: 1; min-height: 0; display: flex; padding: 1vmin 0 0; }

  .shell {
    flex: 1; margin: 0 1vmin; display: flex; flex-direction: column;
    align-items: stretch; justify-content: space-evenly; padding: 2.5vmin 3vmin 2vmin;
    border-radius: 5vmin;
    background: linear-gradient(180deg, #c0c4c8 0%, #a0a5aa 45%, #8e9398 100%);
    box-shadow:
      inset 0 0 0 3px #6d7276,          /* outer seam line  */
      inset 0 0 0 7px #989da2,          /* inner groove     */
      inset 0 6px 12px rgba(255,255,255,.35),   /* top plastic shine */
      inset 0 -8px 14px rgba(0,0,0,.22),        /* bottom shade     */
      0 10px 24px rgba(0,0,0,.55);              /* drop shadow      */
  }

  .controls { flex: 1; width: 100%; display: flex; align-items: flex-start;
    justify-content: space-between; }

  /* --- D-pad: one contiguous black cross --- */
  #dpad { display: grid; grid-template: repeat(3, min(14vmin, 92px)) / repeat(3, min(14vmin, 92px));
    gap: 0; }
  #dpad .key, #dpad .cap {
    border-radius: 1.6vmin; background: linear-gradient(180deg, #2f3236, #16181b);
    border: 1px solid #05070a;
    box-shadow: inset 0 2px 3px rgba(255,255,255,.14), inset 0 -2px 4px rgba(0,0,0,.6),
                0 2px 5px rgba(0,0,0,.5);
  }
  #dpad .key { color: #b9bec3; font-size: min(6.6vmin, 42px); display: flex;
    align-items: center; justify-content: center; }
  #dpad .key.on { color: #fff; box-shadow: 0 0 0 2px #fbbf24, inset 0 2px 3px rgba(255,255,255,.2); }
  #dpad .cap { pointer-events: none; }

  /* --- SELECT / START: light gray concave pill buttons --- */
  .mid { display: flex; gap: 3.5vmin; align-items: flex-start; margin-top: 7vmin; }
  .mid .key { width: min(22vmin, 120px); height: min(6.5vmin, 34px); border-radius: 100px;
    background: linear-gradient(180deg, #d8dbdd, #b9bdc1); border: 1px solid #8f9499;
    color: #4a4f54; font-size: min(3.2vmin, 14px); letter-spacing: 1px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 2px 3px rgba(255,255,255,.6), 0 2px 3px rgba(0,0,0,.3);
    text-transform: uppercase; }

  /* --- A / B: red domed round buttons, diagonal (A upper-right, B lower-left) --- */
  #ab { display: grid; grid-template: repeat(2, min(15vmin, 100px)) / repeat(2, min(15vmin, 100px));
    gap: 2vmin; }
  #fire { grid-area: 1 / 2 / 2 / 3; flex-direction: column; gap: 0.2vmin; }
  #use  { grid-area: 2 / 1 / 3 / 2; flex-direction: column; gap: 0.2vmin; }
  #fire, #use { border-radius: 50%; display: flex; align-items: center; justify-content: center;
    border: 2px solid; }
  #fire { background: radial-gradient(circle at 35% 28%, #f05145, #b51409 70%, #7c0d03);
    border-color: #6d0b02; color: #fff;
    box-shadow: inset 0 4px 6px rgba(255,255,255,.35), inset 0 -5px 8px rgba(0,0,0,.45),
                0 4px 6px rgba(0,0,0,.45); }
  #fire.on { background: radial-gradient(circle at 35% 28%, #ffc2bb, #ff4636 70%, #e02012); }
  #use { background: radial-gradient(circle at 35% 28%, #e86a5f, #c0261a 70%, #80150c);
    border-color: #6d0b02; color: #fff;
    box-shadow: inset 0 4px 6px rgba(255,255,255,.3), inset 0 -4px 7px rgba(0,0,0,.4),
                0 4px 6px rgba(0,0,0,.45); }
  #use.on { background: radial-gradient(circle at 35% 28%, #ffd7d1, #ff6a5c 70%, #e04232); }
  #fire .lbl { font-size: min(8.2vmin, 52px); font-weight: 700; line-height: 1; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  #fire .fn, #use .fn { font-size: min(3vmin, 13px); letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  #use .lbl { font-size: min(6.2vmin, 38px); font-weight: 700; line-height: 1; text-shadow: 0 1px 2px rgba(0,0,0,.4); }

  /* --- NES-style lettering, lower-left of the pad --- */
  .brand { margin-top: 1vmin; text-align: left; padding: 0 1vmin; }
  .brand .rule { display: block; width: min(22vmin, 110px); height: 2px; background: #c62828;
    margin-bottom: 0.6vmin; }
  .brand .name { display: block; font-style: italic; font-weight: 800; font-size: min(4.6vmin, 22px);
    color: #262a2e; letter-spacing: 0.5px; line-height: 1; }
  .brand .tag { display: block; font-style: italic; font-size: min(2.2vmin, 9px); font-weight: 600;
    color: #5c6166; letter-spacing: 2.5px; margin-top: 0.5vmin; }

  .legend { font-size: 11px; color: #8b98a5; text-align: center; padding: 4px 8px; }
</style>
</head>
<body>
  <header>
    <h1>DOOM CONTROLLER</h1>
    <div id="status">not connected</div>
    <button id="connect">Connect</button>
  </header>

  <div class="gamepad">
    <div class="shell">
      <div class="controls">
        <div class="cluster" id="dpad">
          <span></span>
          <div class="key" data-bit="1">▲</div>
          <span></span>
          <div class="key" data-bit="4">◀</div>
          <div class="cap"></div>
          <div class="key" data-bit="8">▶</div>
          <span></span>
          <div class="key" data-bit="2">▼</div>
          <span></span>
        </div>

        <div class="mid">
          <div class="key" id="select" data-bit="128" data-pulse="1">SELECT</div>
          <div class="key" id="start" data-bit="64">START</div>
        </div>

        <div class="cluster" id="ab">
          <span></span>
          <div class="key" id="fire" data-bit="16"><span class="lbl">A</span><span class="fn">FIRE</span></div>
          <div class="key" id="use" data-bit="32"><span class="lbl">B</span><span class="fn">USE</span></div>
          <span></span>
        </div>
      </div>

      <div class="brand">
        <span class="rule"></span>
        <span class="name">DOOM</span>
        <span class="tag">ENTERTAINMENT SYSTEM</span>
      </div>
    </div>
  </div>

  <p class="legend">D-pad move / turn · A FIRE · B USE · START MAP · SELECT MUTE</p>

<script>
const SERVICE_UUID = "d00d0001-0000-4000-8000-000000000000";
const COMMAND_UUID = "d00d0002-0000-4000-8000-000000000000";

const statusEl = document.getElementById("status");
const connectEl = document.getElementById("connect");
const keys = Array.from(document.querySelectorAll(".key[data-bit]"))
  .filter(k => !k.dataset.pulse);

let device = null;
let characteristic = null;
let mask = 0;
let pending = null;
let sending = false;

function lockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      Promise.resolve(screen.orientation.lock("landscape")).catch(() => {});
    }
  } catch (e) { /* best effort only */ }
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

function render() {
  keys.forEach(k => k.classList.toggle("on", (mask & Number(k.dataset.bit)) !== 0));
}

async function writeMask(value) {
  if (!characteristic) return;
  const data = new Uint8Array([value]);
  if (characteristic.writeValueWithoutResponse) {
    try {
      await characteristic.writeValueWithoutResponse(data);
      return;
    } catch (e) { /* fall through to write-with-response */ }
  }
  await characteristic.writeValue(data);
}

function pushMask() {
  pending = mask;
  if (sending) return;
  sending = true;
  (async () => {
    try {
      while (pending !== null) {
        const value = pending;
        pending = null;
        await writeMask(value);
      }
    } catch (e) {
      setStatus("write failed: " + e.message, "bad");
    } finally {
      sending = false;
    }
  })();
}

function setBit(bit, pressed) {
  const next = pressed ? (mask | bit) : (mask & ~bit);
  if (next === mask) return;
  mask = next;
  render();
  pushMask();
}

keys.forEach(key => {
  const bit = Number(key.dataset.bit);
  key.addEventListener("pointerdown", e => {
    e.preventDefault();
    key.setPointerCapture(e.pointerId);
    setBit(bit, true);
  });
  const release = e => setBit(bit, false);
  key.addEventListener("pointerup", release);
  key.addEventListener("pointercancel", release);
  key.addEventListener("lostpointercapture", release);
  key.addEventListener("contextmenu", e => e.preventDefault());
});

// Momentary MUTE: pulse bit7 (do not hold, or the firmware toggles repeatedly).
const muteEl = document.getElementById("select");
muteEl.addEventListener("pointerdown", e => {
  e.preventDefault();
  muteEl.setPointerCapture(e.pointerId);
  setBit(Number(muteEl.dataset.bit), true);
  setTimeout(() => setBit(Number(muteEl.dataset.bit), false), 120);
});

async function connect() {
  if (!navigator.bluetooth) {
    setStatus("Web Bluetooth not available", "bad");
    return;
  }

  lockLandscape();

  try {
    setStatus("scanning...", "");
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: "DeskPet-Doom" }],
      optionalServices: [SERVICE_UUID]
    });

    device.addEventListener("gattserverdisconnected", () => {
      characteristic = null;
      mask = 0;
      render();
      setStatus("disconnected", "bad");
      connectEl.disabled = false;
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(COMMAND_UUID);

    connectEl.disabled = true;
    setStatus("connected to DeskPet-Doom", "ok");
    mask = 0;
    render();
    pushMask();
  } catch (e) {
    setStatus(e.name === "NotFoundError" ? "no device selected" : e.message, "bad");
  }
}

connectEl.addEventListener("click", connect);
lockLandscape();
</script>
</body>
</html>
