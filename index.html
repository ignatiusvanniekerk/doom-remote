<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>DeskPet-Doom controller</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #101418; color: #e8eef2;
    font-family: system-ui, sans-serif; touch-action: none; overscroll-behavior: none;
    overflow: hidden; }
  body { display: flex; flex-direction: column; }

  /* --- top bar (compact so the controller gets the screen) --- */
  header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
  h1 { font-size: 15px; letter-spacing: 1px; margin: 0; white-space: nowrap; }
  #status { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #232a31;
    white-space: nowrap; margin-left: auto; }
  #status.ok { background: #14532d; }
  #status.bad { background: #7f1d1d; }
  #connect { padding: 8px 16px; border-radius: 9px; font-size: 13px; border: none;
    background: #2563eb; color: #fff; white-space: nowrap; }
  #connect:disabled { background: #334155; }
  button { font: inherit; color: inherit; background: #232a31; border: 1px solid #3b4450; }

  /* --- controller shell (classic gray pad) --- */
  .gamepad { flex: 1; min-height: 0; display: flex; padding: 1vmin 0 0; }
  .shell {
    flex: 1; margin: 0 2vmin; display: flex; flex-direction: column;
    align-items: center; justify-content: space-evenly; padding: 2vmin 3vmin;
    border-radius: 4vmin;
    background: linear-gradient(180deg, #a8aeb3, #8e949a);
    box-shadow: inset 0 0 0 2px #6d7379, 0 8px 20px rgba(0,0,0,.5);
  }
  .controls { flex: 1; width: 100%; display: flex; align-items: center;
    justify-content: space-between; }
  .brand { font-size: min(2.6vmin, 11px); letter-spacing: 2px; color: #5c6166;
    text-align: center; margin-top: 1vmin; font-style: italic; }

  .key { user-select: none; touch-action: none; }
  .key.on { border-color: #fbbf24 !important; box-shadow: 0 0 0 2px #fbbf24, 0 3px 8px rgba(0,0,0,.4); }

  /* --- D-pad: dark cruciform, left-hand cluster --- */
  #dpad { display: grid; grid-template: repeat(3, min(12vmin, 60px)) / repeat(3, min(12vmin, 60px));
    gap: 1vmin; }
  #dpad .key { border-radius: 2.2vmin; background: linear-gradient(180deg,#2b2b2b,#15171a);
    border: 1px solid #04060a; color: #c4c9ce; font-size: min(6vmin, 30px);
    display: flex; align-items: center; justify-content: center; }

  /* --- START / SELECT pills, middle of the pad --- */
  .mid { display: flex; gap: 2.4vmin; align-items: center; }
  .mid .key { width: min(16vmin, 70px); height: min(5.5vmin, 24px); border-radius: 100px;
    background: linear-gradient(180deg,#3a3f46,#23272c); border: 1px solid #15181c;
    color: #d6dce2; font-size: min(2.6vmin, 11px); letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center; }

  /* --- A / B round buttons, right-hand cluster (diagonal like the NES) --- */
  #ab { display: grid; grid-template: repeat(2, min(13vmin, 66px)) / repeat(2, min(13vmin, 66px));
    gap: 1.4vmin; }
  #fire { grid-area: 1 / 2 / 2 / 3; flex-direction: column; gap: 0.2vmin; }
  #use  { grid-area: 2 / 1 / 3 / 2; flex-direction: column; gap: 0.2vmin; }
  #fire, #use { border-radius: 50%; display: flex; align-items: center; justify-content: center;
    border: 2px solid; }
  #fire { background: radial-gradient(circle at 35% 30%, #e0483c, #a51108);
    border-color: #7d0c04; color: #fff; }
  #fire.on { background: radial-gradient(circle at 35% 30%, #ffb3aa, #ff3b2f); }
  #use { background: radial-gradient(circle at 35% 30%, #f2766b, #c0261a);
    border-color: #8c160d; color: #fff; }
  #use.on { background: radial-gradient(circle at 35% 30%, #ffcfc9, #ff6a5c); }
  #fire .lbl { font-size: min(7vmin, 34px); font-weight: 700; line-height: 1; }
  #fire .fn, #use .fn { font-size: min(2.6vmin, 11px); letter-spacing: 1px; }
  #use .lbl { font-size: min(5vmin, 24px); font-weight: 700; line-height: 1; }

  .legend { font-size: 11px; color: #8b98a5; text-align: center; padding: 4px 8px; }
</style>
</head>
<body>
  <header>
    <h1>DOOM CONTROLLER</h1>
    <div id="status">not connected</div>
    <button id="connect">Connect</button>
  </header>

  <div class="gamepad">
    <div class="shell">
      <div class="controls">
        <div class="cluster" id="dpad">
          <span></span>
          <div class="key" data-bit="1">▲</div>
          <span></span>
          <div class="key" data-bit="4">◀</div>
          <span></span>
          <div class="key" data-bit="8">▶</div>
          <span></span>
          <div class="key" data-bit="2">▼</div>
          <span></span>
        </div>

        <div class="mid">
          <div class="key" id="select" data-bit="128" data-pulse="1">SELECT</div>
          <div class="key" id="start" data-bit="64">START</div>
        </div>

        <div class="cluster" id="ab">
          <span></span>
          <div class="key" id="fire" data-bit="16"><span class="lbl">A</span><span class="fn">FIRE</span></div>
          <div class="key" id="use" data-bit="32"><span class="lbl">B</span><span class="fn">USE</span></div>
          <span></span>
        </div>
      </div>
      <div class="brand">DOOM</div>
    </div>
  </div>

  <p class="legend">D-pad move / turn · A FIRE · B USE · START MAP · SELECT MUTE</p>

<script>
const SERVICE_UUID = "d00d0001-0000-4000-8000-000000000000";
const COMMAND_UUID = "d00d0002-0000-4000-8000-000000000000";

const statusEl = document.getElementById("status");
const connectEl = document.getElementById("connect");
const keys = Array.from(document.querySelectorAll(".key[data-bit]"))
  .filter(k => !k.dataset.pulse);

let device = null;
let characteristic = null;
let mask = 0;
let pending = null;
let sending = false;

function lockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      Promise.resolve(screen.orientation.lock("landscape")).catch(() => {});
    }
  } catch (e) { /* best effort only */ }
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

function render() {
  keys.forEach(k => k.classList.toggle("on", (mask & Number(k.dataset.bit)) !== 0));
}

async function writeMask(value) {
  if (!characteristic) return;
  const data = new Uint8Array([value]);
  if (characteristic.writeValueWithoutResponse) {
    try {
      await characteristic.writeValueWithoutResponse(data);
      return;
    } catch (e) { /* fall through to write-with-response */ }
  }
  await characteristic.writeValue(data);
}

function pushMask() {
  pending = mask;
  if (sending) return;
  sending = true;
  (async () => {
    try {
      while (pending !== null) {
        const value = pending;
        pending = null;
        await writeMask(value);
      }
    } catch (e) {
      setStatus("write failed: " + e.message, "bad");
    } finally {
      sending = false;
    }
  })();
}

function setBit(bit, pressed) {
  const next = pressed ? (mask | bit) : (mask & ~bit);
  if (next === mask) return;
  mask = next;
  render();
  pushMask();
}

keys.forEach(key => {
  const bit = Number(key.dataset.bit);
  key.addEventListener("pointerdown", e => {
    e.preventDefault();
    key.setPointerCapture(e.pointerId);
    setBit(bit, true);
  });
  const release = e => setBit(bit, false);
  key.addEventListener("pointerup", release);
  key.addEventListener("pointercancel", release);
  key.addEventListener("lostpointercapture", release);
  key.addEventListener("contextmenu", e => e.preventDefault());
});

// Momentary MUTE: pulse bit7 (do not hold, or the firmware toggles repeatedly).
const muteEl = document.getElementById("select");
muteEl.addEventListener("pointerdown", e => {
  e.preventDefault();
  muteEl.setPointerCapture(e.pointerId);
  setBit(Number(muteEl.dataset.bit), true);
  setTimeout(() => setBit(Number(muteEl.dataset.bit), false), 120);
});

async function connect() {
  if (!navigator.bluetooth) {
    setStatus("Web Bluetooth not available", "bad");
    return;
  }

  lockLandscape();

  try {
    setStatus("scanning...", "");
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: "DeskPet-Doom" }],
      optionalServices: [SERVICE_UUID]
    });

    device.addEventListener("gattserverdisconnected", () => {
      characteristic = null;
      mask = 0;
      render();
      setStatus("disconnected", "bad");
      connectEl.disabled = false;
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(COMMAND_UUID);

    connectEl.disabled = true;
    setStatus("connected to DeskPet-Doom", "ok");
    mask = 0;
    render();
    pushMask();
  } catch (e) {
    setStatus(e.name === "NotFoundError" ? "no device selected" : e.message, "bad");
  }
}

connectEl.addEventListener("click", connect);
lockLandscape();
</script>
</body>
</html>
